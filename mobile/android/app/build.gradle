plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'town.donggeurami'
    compileSdk 34

    defaultConfig {
        applicationId "town.donggeurami.app"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            assets.srcDirs += files('../../../assets')
        }
    }
    androidResources {
        // What the game never loads stays out of the APK: Blender's own files
        // and the rest named in assets-left-out.txt, after what aapt leaves
        // out anyway (its default: hidden files, version control).
        ignoreAssetsPattern = ([
            '!.svn', '!.git', '!.ds_store', '!*.scc', '.*', '<dir>_*', '!CVS',
            '!thumbs.db', '!picasa.ini', '!*~',
        ] + file('assets-left-out.txt').readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
            .collect { '!' + it }).join(':')
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
}

// Native lib is produced separately (not run by default). Use the
// `release-android` profile, not `release`: NDK + thin LTO is slow and can fail
// the linker. cargo ndk does not strip for a custom profile either, so the .so
// comes out at 162 MB instead of 85 MB and has to be stripped by hand — and the
// target-dir and jniLibs copies are hardlinked, so strip to a temp file and move
// it over rather than editing in place. See RENDERING.md, "Build gotchas".
//
//   cargo ndk -t arm64-v8a -P 26 -o mobile/android/app/src/main/jniLibs \
//       build --profile release-android --lib
//   llvm-strip -o tmp.so mobile/android/app/src/main/jniLibs/arm64-v8a/libdonggeurami_town.so
//   mv tmp.so mobile/android/app/src/main/jniLibs/arm64-v8a/libdonggeurami_town.so
//
// Then: ./gradlew assembleRelease
