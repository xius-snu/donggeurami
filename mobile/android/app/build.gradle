plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'town.donggeurami'
    compileSdk 34

    defaultConfig {
        applicationId "town.donggeurami.app"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
    sourceSets {
        main {
            assets.srcDirs += files('../../../assets')
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.games.activity
}

// Native lib is produced separately (not run by default):
//   cargo ndk -t arm64-v8a -P 26 -o mobile/android/app/src/main/jniLibs build --release
// Then: ./gradlew installDebug
