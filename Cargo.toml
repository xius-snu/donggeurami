# The game is the root crate. Beside it: what it and its server say to each
# other (`shared/`), and the server (`server/`), a headless Bevy app built for
# Linux. `cargo build` here builds the game alone; the server is
# `cargo build -p roundtown_server`, never `--workspace`, which would build
# the game with the server's half of replicon too.
[workspace]
members = ["shared", "server"]

[package]
name = "donggeurami_town"
version = "0.1.0"
edition = "2024"
description = "동그라미타운 — a third-person 3D Bevy world"
publish = false
default-run = "donggeurami_town_pc"

# Desktop: `cargo run` uses the bin. The `_pc` suffix keeps MSVC .pdb names
# distinct from the lib (Cargo maps hyphens to underscores on Windows).
# Android: cargo-ndk builds this cdylib into libdonggeurami_town.so
# iOS: nothing links the staticlib. Bevy 0.19 ships iOS apps as a plain
# Rust binary, so mobile/ios/build_rust.sh builds the [[bin]] below for
# aarch64-apple-ios and Xcode just bundles the result. The staticlib stays
# as the escape hatch if that ever changes.
[lib]
name = "donggeurami_town"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "donggeurami_town_pc"
path = "src/main.rs"

[dependencies]
# `android-game-activity` is required by Bevy's Android GameActivity path.
# It is a no-op on Windows/iOS.
bevy = { version = "0.19.1", features = ["android-game-activity"] }

# The town save. JSON rather than RON so the one document a player's map lives
# in can go straight into a server column later without a second encoder. Both
# crates already come in under Bevy, so this costs no extra build time.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The AI players' dice. Already built for Bevy's task executor on every
# target, so this costs no extra build time either.
fastrand = "2"

# Playing online (MULTIPLAYER.md): the protocol shared with the server, and
# the client halves of replicon and renet. Pure Rust, UDP, no async runtime.
roundtown_net = { path = "shared" }
bevy_replicon = { version = "=0.44.3", default-features = false, features = ["client"] }
bevy_replicon_renet = { version = "=0.20.0", default-features = false, features = [
    "client",
    "renet_netcode",
] }
# The login, over HTTPS, trusting nothing but the server's own certificate
# (`login`): rustls with ring, which the NDK, Xcode and MSVC all build.
# Not aws-lc-rs, rustls's default, which wants CMake and NASM besides.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ring = "0.17"

# Faster debug iteration without tanking frame rate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Android NDK + thin LTO is slow and can fail the linker. Keep an installable
# optimized lib without LTO.
[profile.release-android]
inherits = "release"
lto = false
codegen-units = 8
